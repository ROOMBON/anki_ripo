name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  # פותר את אזהרת ה-Node.js ומגדיר ל-Gradle לא להחשיב אזהרות כשגיאות
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  CI: 'false' 

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        # רוב הגרסאות היציבות של AnkiDroid דורשות JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        # הסבר על הפרמטרים:
        # clean - מנקה שאריות קודם
        # -x test - מבטל הרצת טסטים (חוסך זמן ומונע כשלונות לא רלוונטיים)
        # -x lint - מבטל בדיקות Lint (שמכשילות בילדים על אזהרות עיצוב קוד)
        # --no-daemon - חוסך בזיכרון RAM על השרת
        run: ./gradlew clean assembleDebug -x test -x lint --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: anki-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
