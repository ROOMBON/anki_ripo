name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch: # מאפשר להריץ את הבנייה באופן ידני דרך לשונית Actions ב-GitHub

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        # בניית גרסת Debug אינה דורשת הגדרת מפתחות חתימה (Keystore) ותוכל לרוץ מיד
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          # חיפוש דינמי של כל קובצי ה-APK שנוצרו במהלך הבנייה
          path: '**/build/outputs/apk/**/*.apk'
